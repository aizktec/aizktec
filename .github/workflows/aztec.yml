name: Aztec Noir Contracts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js (LTS)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Docker
        uses: docker-practice/actions-setup-docker@master

      - name: Start Docker
        run: |
          sudo systemctl start docker
          docker --version

      - name: Install Aztec CLI and Sandbox
        shell: bash
        run: |
          curl -s https://install.aztec.network | bash
          echo "$HOME/.aztec/bin" >> $GITHUB_PATH

      - name: Start Aztec Sandbox
        shell: bash
        run: |
          ~/.aztec/bin/aztec start --sandbox &
          sleep 30  # Da tiempo a que el sandbox levante correctamente

      - name: Compile Noir Contracts
        run: ~/.aztec/bin/aztec-nargo compile
        working-directory: packages/aztec/contracts/nft_contract

