name: Aztec Noir Contracts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js (LTS)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Docker
        uses: docker-practice/actions-setup-docker@master

      - name: Start Docker
        run: |
          sudo systemctl start docker
          docker info

      - name: Install Aztec Sandbox
        run: bash -i <(curl -s https://install.aztec.network)

      - name: Start Aztec Sandbox in background
        run: |
          ~/.aztec/bin/aztec start --sandbox &
          echo "Waiting for sandbox to be ready..."
          sleep 100
          echo "Sandbox should be ready."

      - name: Compile all Noir Contracts
        run: |
          set -e
          for dir in packages/aztec/contracts/*/
          do
            if [ -f "$dir/nargo.toml" ]; then
              echo "🔧 Compiling contract in $dir"
              cd "$dir"
              ~/.aztec/bin/aztec-nargo compile
              echo "✅ Successfully compiled $dir"
              cd - > /dev/null
            fi
          done
        shell: /usr/bin/bash -e {0}
        env:
          DOCKER_CONFIG: /home/runner/.docker
          DOCKER_CLI_EXPERIMENTAL: enabled

