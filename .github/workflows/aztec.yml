name: Aztec Noir Smart Contracts CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-contracts:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/sbin" >> $GITHUB_PATH
          brew update

      - name: Install Docker Desktop and Start
        run: |
          echo "Installing Docker Desktop via Homebrew Cask..."
          brew install --cask docker

          echo "Attempting to launch Docker Desktop..."
          # Directly execute the Docker Desktop binary.
          # This should launch the application in the background.
          /Applications/Docker.app/Contents/MacOS/Docker --unattended --quit-after-install &

          echo "Waiting for Docker daemon to be responsive..."
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + 300)) # 5 minutes from now

          while true; do
            CURRENT_TIME=$(date +%s)
            if [ "$CURRENT_TIME" -ge "$END_TIME" ]; then
              echo "Docker failed to start within 5 minutes. Exiting."
              exit 1
            fi
            docker info >/dev/null 2>&1
            if [ $? -eq 0 ]; then
              echo "Docker daemon is running!"
              break
            fi
            echo "Waiting for Docker... ($((END_TIME - CURRENT_TIME)) seconds left)"
            sleep 10
          done

          echo "Docker version:"
          docker version
          echo "Docker info (server version):"
          docker info --format '{{.ServerVersion}}'

      - name: Install Aztec Sandbox
        run: |
          echo "Installing Aztec Sandbox CLI tools..."
          bash -i <(curl -s https://install.aztec.network)
          # Add Aztec CLI tools to PATH. The installer typically adds them to ~/.aztec/bin
          echo "$HOME/.aztec/bin" >> $GITHUB_PATH

          echo "Verifying Aztec CLI installation:"
          aztec --version
          aztec-nargo --version
          aztec-up --version
          aztec-wallet --version

      - name: Start Aztec Sandbox
        run: |
          echo "Starting Aztec Sandbox in the background..."
          aztec start --sandbox &

          echo "Waiting for Aztec Sandbox to be ready and synced..."
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + 300)) # 5 minutes from now

          while true; do
            CURRENT_TIME=$(date +%s)
            if [ "$CURRENT_TIME" -ge "$END_TIME" ]; then
              echo "Aztec Sandbox failed to sync within 5 minutes. Exiting."
              exit 1
            fi
            curl -s http://localhost:8080/status | grep -q "synced"
            if [ $? -eq 0 ]; then
              echo "Aztec Sandbox is running and synced!"
              break
            fi
            echo "Waiting for sandbox... ($((END_TIME - CURRENT_TIME)) seconds left)"
            sleep 10
          done

      - name: Compile Smart Contracts
        run: |
          echo "Navigating to contract directory..."
          cd ./packages/aztec/contracts/nft_contract
          echo "Compiling smart contracts with aztec-nargo..."
          aztec-nargo compile
          echo "Smart contracts compiled successfully."

      - name: Debug on Failure
        if: failure()
        run: |
          echo "--- Debugging Information ---"
          echo "Current directory contents:"
          ls -la
          echo "Contents of nargo.toml (if exists):"
          cat ./nargo.toml || echo "nargo.toml not found"
          echo "Docker status:"
          docker info || echo "Docker is not running or accessible."
          docker ps -a || echo "No Docker containers found."
          echo "Aztec processes:"
          ps aux | grep aztec || echo "No Aztec processes found."
          echo "Network status for port 8080:"
          lsof -i :8080 || echo "Port 8080 not in use."
          echo "Disk space:"
          df -h
          echo "System hardware information:"
          system_profiler SPHardwareDataType
          echo "Node.js version:"
          node -v
          echo "npm version:"
          npm -v
