name: Aztec Noir Smart Contracts CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-contracts:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/opt/homebrew/bin:/opt/homebrew/sbin" >> $GITHUB_PATH
          brew update

      - name: Install Docker Desktop
        run: |
          brew install --cask docker
          /Applications/Docker.app/Contents/MacOS/Docker --quit-after-install --unattended
          open -a Docker
          timeout 60s bash -c 'until docker info >/dev/null 2>&1; do sleep 5; echo "Waiting for Docker..."; done'
          docker version
          docker info --format '{{.ServerVersion}}'

      - name: Debug Docker
        if: failure()
        run: |
          docker info || echo "Docker is not running"
          docker ps || echo "No containers running"
          ls -la /Applications/Docker.app || echo "Docker.app not found"
          df -h
          system_profiler SPHardwareDataType

      - name: Install Aztec Sandbox
        run: |
          bash -i <(curl -s https://install.aztec.network)

      - name: Start Aztec Sandbox
        run: |
          aztec start --sandbox &
          timeout 180s bash -c 'until curl -s http://localhost:8080/status | grep -q "synced"; do sleep 5; echo "Waiting for sandbox..."; done'
        env:
          AZTEC_START_TIMEOUT: 180

      - name: Compile Smart Contracts
        run: |
          cd ./packages/aztec/contracts/nft_contract
          aztec-nargo compile

      - name: Debug Aztec Compilation
        if: failure()
        run: |
          aztec --version
          aztec-nargo --version
          ls -la
          cat ./nargo.toml || echo "nargo.toml not found"
          
