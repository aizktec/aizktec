name: Aztec Noir Smart Contracts CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-contracts:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Install Colima and Docker
        run: |
          brew install colima docker
          colima start --cpu 2 --memory 4
          docker version

      - name: Install Aztec Sandbox
        run: |
          bash -i <(curl -s https://install.aztec.network)

      - name: Start Aztec Sandbox
        run: |
          aztec start --sandbox &
          timeout 120s bash -c 'until curl -s http://localhost:8080/status | grep -q "synced"; do sleep 5; echo "Waiting for sandbox..."; done'
        env:
          AZTEC_START_TIMEOUT: 120

      - name: Compile Smart Contracts
        run: |
          cd ./packages/aztec/contracts/nft_contract
          aztec-nargo compile
