name: Aztec Noir Contracts CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  setup-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: 🐳 Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: 🧪 Install Aztec CLI
        run: |
          echo "🔧 Installing Aztec CLI..."
          curl -s https://install.aztec.network > tmp.sh
          bash tmp.sh <<< yes "yes"
          echo "✅ Aztec CLI installed."

      - name: ➕ Update PATH
        run: |
          echo "🛠 Updating PATH to include Aztec binaries..."
          echo "/home/runner/.aztec/bin" >> $GITHUB_PATH

      - name: 🧱 Set Aztec version and start sandbox
        run: |
          echo "🚀 Setting Aztec version and starting sandbox..."
          VERSION=0.87.8 aztec-up
          aztec start --sandbox &
          echo "✅ Aztec sandbox started."

      - name: 📥 Install project dependencies
        run: |
          echo "📦 Installing project dependencies with Yarn..."
          yarn
          echo "✅ Dependencies installed."

      # === nargo compile ===
      - name: 🛠 Compile Noir contracts with nargo
        run: |
          echo "🔍 Running 'nargo compile'..."
          nargo compile
          echo "✅ 'nargo compile' completed successfully."

      # === nargo test ===
      - name: 🧪 Test Noir contracts with nargo
        run: |
          echo "🧪 Running 'nargo test'..."
          nargo test
          echo "✅ 'nargo test' completed successfully."

      # === aztec-nargo compile ===
      - name: 🛠 Compile Noir contracts with aztec-nargo
        run: |
          echo "🔍 Running 'aztec-nargo compile'..."
          script -e -c "${AZTEC_NARGO:-aztec-nargo} compile"
          echo "✅ 'aztec-nargo compile' completed successfully."

      - name: 🧬 Codegen
        run: |
          echo "🧬 Running code generation..."
          script -e -c "aztec codegen target --outdir src/artifacts"
          echo "✅ Codegen completed."

      - name: 🔐 Fix ownership
        run: |
          echo "🛠 Fixing ownership permissions..."
          sudo chown -R $(whoami) ~/nargo
          sudo chown -R $(whoami) ~/nargo/github.com
          echo "✅ Ownership permissions fixed."

      - name: 🧪 Run Jest and Aztec tests
        run: |
          echo "🧪 Running Jest and Aztec tests..."
          script -e -c "NODE_NO_WARNINGS=1 node --experimental-vm-modules $(yarn bin jest) --no-cache --runInBand --config jest.integration.config.json && aztec test"
          echo "✅ Tests completed."

      - name: 🚀 Run deployment scripts
        run: |
          echo "🚀 Running deployment and utility scripts..."
          yarn deploy && yarn deploy-account && yarn fees && yarn multiple-pxe && yarn profile
          echo "✅ Scripts executed successfully."
