name: Aztec Noir Contracts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js (LTS)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Docker
        uses: docker-practice/actions-setup-docker@master

      - name: Start Docker
        run: |
          sudo systemctl start docker
          docker --version

      - name: Install Aztec CLI and Sandbox
        run: |
          curl -s https://install.aztec.network | bash
          echo "$HOME/.aztec/bin" >> $GITHUB_PATH

      - name: Start Aztec Sandbox
        run: |
          ~/.aztec/bin/aztec start --sandbox &
          echo "Waiting for sandbox to initialize..."
          sleep 30

      - name: Compile all Noir Contracts
        run: |
          set -e
          for dir in packages/aztec/contracts/*/
          do
            if [ -f "$dir/nargo.toml" ]; then
              echo "🔧 Compiling contract in $dir"
              cd "$dir"
              ~/.aztec/bin/aztec-nargo compile
              echo "✅ Compiled $dir successfully"
              cd - > /dev/null
            fi
          done

